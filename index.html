
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIET </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff9900;
        }

        p {
            color: #333333;
            font-size: 18px;
        }

        button {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e68a00;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to CIET-AWS CI/CD success</h1>
        <p>Automatic deployment</p>
        <button onclick="alert('Hello from AWS S3!')">
            Click Here
        </button>
    </div>
</body>
</html>
